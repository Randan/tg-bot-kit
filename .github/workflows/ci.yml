name: CI

on:
  push:
    branches: [main]
    # full versions only: the floating v1 tag the bots' workflows use must not publish
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run test:cov

  publish:
    # A version tag (v1.2.3) publishes that version to npm once the checks pass.
    # npm Trusted Publishing: GitHub's OIDC token proves the workflow, no npm token
    # to store or renew. Set up once on npmjs.com: package Settings -> Trusted
    # Publisher -> GitHub Actions, this repository, workflow ci.yml.
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: The tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Skip a version that is already on npm
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published, nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
