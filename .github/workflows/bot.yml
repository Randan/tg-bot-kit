# Reusable CI/CD for the bots: lint, format, build, unit tests, then deploy to
# the Pi over Tailscale. A bot's whole workflow:
#
#   name: Deploy
#   on: { push: { branches: [master] }, pull_request: {}, workflow_dispatch: {} }
#   jobs:
#     bot:
#       uses: Randan/tg-bot-kit/.github/workflows/bot.yml@v1
#       with:
#         project: light-tg-bot
#       secrets: inherit
#
# Secrets the bot repo must have: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, HOST,
# USERNAME, PASSWORD, PORT.
name: Bot CI/CD

on:
  workflow_call:
    inputs:
      project:
        description: The folder in /home/randan/projects on the Pi
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: '24'
      deploy-branch:
        required: false
        type: string
        default: master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:cov

  deploy:
    # nothing reaches the Pi unless the checks pass
    needs: check
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', inputs.deploy-branch)
    # the full path: inside a called workflow "./" may point at the calling (bot) repository
    uses: Randan/tg-bot-kit/.github/workflows/deploy.yml@v1
    with:
      project: ${{ inputs.project }}
      branch: ${{ inputs.deploy-branch }}
    secrets: inherit
