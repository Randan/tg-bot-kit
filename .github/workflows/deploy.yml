# Reusable deploy to the Pi (R5oRR) over Tailscale: git pull, then docker compose up --build.
# bot.yml calls it after the checks; a non-Node service (e.g. the database) calls it after its own:
#
#   jobs:
#     check: ...
#     deploy:
#       needs: check
#       if: github.event_name == 'push' && github.ref == 'refs/heads/master'
#       uses: Randan/tg-bot-kit/.github/workflows/deploy.yml@v1
#       with:
#         project: r5orr-mongo
#       secrets: inherit
#
# Secrets: TS_OAUTH_CLIENT_ID, TS_OAUTH_SECRET, HOST, USERNAME, PASSWORD, PORT.
name: Deploy to the Pi

on:
  workflow_call:
    inputs:
      project:
        description: The folder in /home/randan/projects on the Pi
        required: true
        type: string
      branch:
        required: false
        type: string
        default: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.HOST }}

      - name: Deploy to RP5
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/randan/projects/${{ inputs.project }}
            git pull origin ${{ inputs.branch }}
            GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
            docker image prune -f
